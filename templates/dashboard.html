<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Automatically refresh the dashboard every 60 seconds -->
    <meta http-equiv="refresh" content="60">

    <title>LittleBuilds Schedule Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
        }

        .dashboard {
            padding: 30px;
        }

        h1 {
            margin-top: 0;
        }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: #1f2937;
            border-radius: 16px;
            padding: 24px;
        }

        .label {
            font-size: 14px;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 10px;
        }

        .big-text {
            font-size: 28px;
            font-weight: bold;
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
    </style>
</head>

<body>

<div class="dashboard">

    <h1>🖥️ LittleBuilds Schedule Dashboard</h1>

    <div class="status-grid">

        <div class="card">
            <div class="label">Now</div>
            <div class="big-text">{{ now_event.title }}</div>
            <p>{{ now_event.time }}</p>
        </div>

        <div class="card">
            <div class="label">What's Next</div>
            <div class="big-text">{{ next_event.title }}</div>
            <p>{{ next_event.time }}</p>
        </div>

    </div>

    <div class="schedule-grid">

        <div class="card">
            <div class="label">Today</div>

            {% for event in today_events %}
                <p>{{ event }}</p>
            {% endfor %}
        </div>

        <div class="card">
            <div class="label">This Week</div>

            {% for event in week_events %}
                <p>{{ event }}</p>
            {% endfor %}
        </div>

    </div>

</div>

</body>
</html>
